<!DOCTYPE html>
<html>
<head>
  <title>Async Weather Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h2>🌤️ Async Weather Tracker</h2>

  <div class="container">

    <!-- LEFT -->
    <div class="left">
      <h4>Search City</h4>
      <input type="text" id="city" placeholder="Enter city">
      <button onclick="getWeather()">Search</button>

      <h4>Search History</h4>
      <div id="history"></div>
    </div>

    <!-- RIGHT -->
    <div class="right">
      <h4>Weather Info</h4>
      <div id="result"></div>
    </div>

  </div>

  <!-- CONSOLE BOX -->
  <div class="console">
    <h4>Console – Event Loop</h4>
    <div id="logs"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
